name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: Sala_911
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fabrica2024*
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/Sala_911
      DB_USERNAME: postgres
      DB_PASSWORD: fabrica2024*
      JWT_SECRET: ci-secret-para-tests-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        working-directory: back
        run: ./mvnw -B test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        working-directory: Front/room911-frontend
        run: |
          pnpm install --no-frozen-lockfile > /tmp/install.log 2>&1 || { tail -120 /tmp/install.log >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          tail -5 /tmp/install.log

      - name: Build
        working-directory: Front/room911-frontend
        run: pnpm build
