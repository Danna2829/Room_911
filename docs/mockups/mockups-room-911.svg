<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <style>
    .bg{fill:#eef2f6}.card{fill:#fff;stroke:#dfe6ec;stroke-width:2}.nav{fill:#162238}.ink{fill:#17212b}.muted{fill:#788797}.blue{fill:#176bff}.green{fill:#168b61}.red{fill:#d94b55}.line{stroke:#e6ebef;stroke-width:2}.white{fill:#fff}.small{font:700 11px Arial;letter-spacing:2px}.label{font:600 12px Arial}.title{font:700 24px Arial}.body{font:14px Arial}.tiny{font:12px Arial}.button{fill:#176bff}.chip{fill:#eaf8f1}.chiptext{fill:#168b61;font:700 11px Arial}.input{fill:#fff;stroke:#d5dee7;stroke-width:2}.teal{fill:#e7f7f1}
  </style>
  <rect width="1400" height="920" fill="#dfe6ee"/>
  <g transform="translate(30,30)">
    <rect class="card" width="650" height="400" rx="18"/>
    <text x="35" y="40" class="small muted">01 · IDENTIFICACIÓN</text>
    <rect x="35" y="65" width="35" height="35" rx="9" class="blue"/><text x="42" y="88" class="white label">911</text><text x="82" y="83" class="ink label">ROOM_911</text><text x="82" y="98" class="muted small" style="font-size:7px">CONTROL DE ACCESO</text>
    <text x="35" y="170" class="small muted">ÁREA RESTRINGIDA</text><text x="35" y="208" class="title ink">Identifica tu acceso</text><text x="35" y="235" class="body muted">Usa tu ID interno para validar el contexto operativo.</text>
    <text x="35" y="280" class="small muted" style="font-size:9px;letter-spacing:1px">ID INTERNO</text><rect x="35" y="294" width="390" height="43" rx="7" class="input"/><text x="52" y="321" class="body muted">Ej. EMP-301</text><rect x="35" y="350" width="390" height="42" rx="7" class="button"/><text x="52" y="376" class="white label">Validar identidad</text><text x="395" y="376" class="white title">→</text>
  </g>
  <g transform="translate(720,30)">
    <rect class="card" width="650" height="400" rx="18"/><rect class="nav" width="150" height="400" rx="18 0 0 18"/><text x="22" y="43" class="white label">ROOM_911</text><text x="22" y="98" class="muted small" style="font-size:8px">SEGURIDAD</text><rect x="13" y="115" width="124" height="38" rx="6" fill="#ffffff18"/><text x="28" y="139" class="white label">◉  Guardia</text><text x="28" y="185" class="muted label">⌂  Resumen</text><text x="28" y="219" class="muted label">▦  Cronograma</text><text x="28" y="253" class="muted label">⇥  Simulador</text><text x="180" y="44" class="small muted">02 · PANEL DE GUARDIA</text><text x="180" y="82" class="title ink">Estado de permisos</text><text x="180" y="108" class="body muted">Control inmediato de credenciales.</text><line x1="180" y1="135" x2="615" y2="135" class="line"/><text x="180" y="162" class="small muted" style="font-size:9px">PERSONA</text><text x="350" y="162" class="small muted" style="font-size:9px">PERFIL</text><text x="470" y="162" class="small muted" style="font-size:9px">ESTADO</text><text x="180" y="199" class="label ink">Carlos López</text><text x="180" y="217" class="tiny muted">EMP-301</text><rect x="350" y="186" width="55" height="23" rx="12" fill="#eff4fa"/><text x="361" y="202" class="tiny muted">Nivel 1</text><circle cx="475" cy="196" r="4" class="green"/><text x="486" y="201" class="tiny green">Activo</text><line x1="180" y1="238" x2="615" y2="238" class="line"/><text x="180" y="272" class="label ink">María García</text><text x="180" y="290" class="tiny muted">EMP-302</text><rect x="350" y="259" width="55" height="23" rx="12" fill="#eff4fa"/><text x="361" y="275" class="tiny muted">Nivel 2</text><circle cx="475" cy="269" r="4" class="red"/><text x="486" y="274" class="tiny red">Suspendido</text><rect x="180" y="330" width="130" height="38" rx="7" class="button"/><text x="197" y="354" class="white label">Guardar cambio</text>
  </g>
  <g transform="translate(30,480)">
    <rect class="card" width="650" height="400" rx="18"/><text x="35" y="40" class="small muted">03 · SECRETARÍA</text><text x="35" y="82" class="title ink">Cronograma operativo</text><text x="35" y="108" class="body muted">Publica medicamento, franja y actividad.</text><rect x="35" y="135" width="255" height="220" rx="10" fill="#f8fafb"/><text x="55" y="166" class="label ink">Nueva franja</text><text x="55" y="198" class="small muted" style="font-size:8px">DÍA</text><rect x="55" y="208" width="95" height="33" rx="6" class="input"/><text x="67" y="229" class="tiny ink">Martes⌄</text><text x="55" y="270" class="small muted" style="font-size:8px">MEDICAMENTO</text><rect x="55" y="280" width="195" height="33" rx="6" class="input"/><text x="67" y="301" class="tiny ink">Morfina · Tipo 4⌄</text><rect x="55" y="325" width="125" height="27" rx="6" class="button"/><text x="68" y="343" class="white tiny">Publicar franja →</text><text x="325" y="166" class="label ink">Agenda publicada</text><line x1="325" y1="185" x2="610" y2="185" class="line"/><text x="325" y="218" class="small blue" style="font-size:10px">MAR</text><text x="375" y="218" class="label ink">Morfina</text><text x="375" y="237" class="tiny muted">08:00 — 12:00 · Alto control</text><rect x="570" y="202" width="30" height="23" rx="5" fill="#edf3ff"/><text x="577" y="218" class="tiny blue">T4</text><line x1="325" y1="258" x2="610" y2="258" class="line"/><text x="325" y="291" class="small blue" style="font-size:10px">JUE</text><text x="375" y="291" class="label ink">Amoxicilina</text><text x="375" y="310" class="tiny muted">06:00 — 14:00 · Preparación</text><rect x="570" y="275" width="30" height="23" rx="5" fill="#edf3ff"/><text x="577" y="291" class="tiny blue">T2</text>
  </g>
  <g transform="translate(720,480)">
    <rect class="card" width="650" height="400" rx="18"/><text x="35" y="40" class="small muted">04 · GARITA</text><text x="35" y="82" class="title ink">Simulador de torniquete</text><text x="35" y="108" class="body muted">La respuesta queda registrada en auditoría.</text><rect x="35" y="140" width="270" height="200" rx="10" fill="#f8fafb"/><rect x="135" y="158" width="70" height="105" rx="6" fill="none" stroke="#cbd6df" stroke-width="7"/><circle cx="170" cy="202" r="24" class="teal"/><text x="163" y="209" class="green title">✓</text><text x="147" y="286" class="small muted" style="font-size:8px">GARITA 01</text><rect x="35" y="355" width="270" height="30" rx="6" class="button"/><text x="77" y="375" class="white label">Presentar ID en garita →</text><text x="345" y="150" class="small muted">RESPUESTA DEL MOTOR</text><circle cx="363" cy="193" r="17" class="teal"/><text x="357" y="200" class="green title">✓</text><text x="390" y="201" class="title ink">Acceso permitido</text><text x="345" y="240" class="body muted">El perfil coincide con la política vigente.</text><line x1="345" y1="270" x2="615" y2="270" class="line"/><text x="345" y="299" class="small muted" style="font-size:8px">MEDICAMENTO EVALUADO</text><text x="345" y="321" class="label ink">Morfina · Tipo 4</text><rect x="345" y="340" width="270" height="40" rx="6" fill="#fff8e8"/><text x="360" y="364" class="tiny" fill="#8c6011">Tarea alternativa solo si se deniega</text>
  </g>
