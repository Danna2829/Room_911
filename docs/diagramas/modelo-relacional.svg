<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <style>
    .bg{fill:#f5f7fb}.tbl{fill:#fff;stroke:#2368c4;stroke-width:2}.th{fill:#2368c4}.t{font:13px Arial;fill:#17212b}.white{font:bold 16px Arial;fill:#fff}.h{font:bold 24px Arial;fill:#17212b}.s{font:13px Arial;fill:#5d6b7a}.rel{stroke:#53687c;stroke-width:2;fill:none}
  </style>
  <rect width="1500" height="960" class="bg"/><text x="45" y="50" class="h">Room_911 · Modelo relacional PostgreSQL</text><text x="45" y="77" class="s">PK = clave primaria · FK = clave foránea · las tablas corresponden a database/schema.sql</text>
  <g transform="translate(60,145)"><rect width="300" height="190" class="tbl"/><rect width="300" height="40" class="th"/><text x="150" y="26" text-anchor="middle" class="white">perfil</text><text x="18" y="70" class="t">PK id BIGSERIAL</text><text x="18" y="98" class="t">nombre VARCHAR(80)</text><text x="18" y="126" class="t">nivel INTEGER CHECK 1..3</text><text x="18" y="154" class="t">tipos_permitidos VARCHAR(120)</text></g>
  <g transform="translate(600,120)"><rect width="360" height="245" class="tbl"/><rect width="360" height="40" class="th"/><text x="180" y="26" text-anchor="middle" class="white">usuario</text><text x="18" y="70" class="t">PK id_usuario VARCHAR(30)</text><text x="18" y="98" class="t">nombre, apellido, correo</text><text x="18" y="126" class="t">rol VARCHAR(20)</text><text x="18" y="154" class="t">FK perfil_id → perfil.id</text><text x="18" y="182" class="t">activo BOOLEAN</text><text x="18" y="210" class="t">suspendido_desde/hasta DATE</text></g>
  <g transform="translate(1140,145)"><rect width="300" height="190" class="tbl"/><rect width="300" height="40" class="th"/><text x="150" y="26" text-anchor="middle" class="white">medicamento</text><text x="18" y="70" class="t">PK id VARCHAR(30)</text><text x="18" y="98" class="t">nombre VARCHAR(120)</text><text x="18" y="126" class="t">tipo INTEGER</text><text x="18" y="154" class="t">activo BOOLEAN</text></g>
  <g transform="translate(60,540)"><rect width="360" height="220" class="tbl"/><rect width="360" height="40" class="th"/><text x="180" y="26" text-anchor="middle" class="white">cronograma</text><text x="18" y="70" class="t">PK id BIGSERIAL</text><text x="18" y="98" class="t">dia_semana, hora_inicio, hora_fin</text><text x="18" y="126" class="t">FK medicamento_id → medicamento.id</text><text x="18" y="154" class="t">actividad VARCHAR(160)</text><text x="18" y="182" class="t">activo BOOLEAN</text></g>
  <g transform="translate(555,510)"><rect width="390" height="280" class="tbl"/><rect width="390" height="40" class="th"/><text x="195" y="26" text-anchor="middle" class="white">acceso</text><text x="18" y="70" class="t">PK id BIGSERIAL</text><text x="18" y="98" class="t">FK usuario_id → usuario.id_usuario</text><text x="18" y="126" class="t">FK medicamento_id → medicamento.id</text><text x="18" y="154" class="t">FK tarea_alternativa_id → tarea.id</text><text x="18" y="182" class="t">fecha_hora, accion, resultado</text><text x="18" y="210" class="t">motivo, tarea_alternativa</text><text x="18" y="238" class="t">ip_origen</text></g>
  <g transform="translate(1080,540)"><rect width="360" height="220" class="tbl"/><rect width="360" height="40" class="th"/><text x="180" y="26" text-anchor="middle" class="white">tarea_alternativa</text><text x="18" y="70" class="t">PK id BIGSERIAL</text><text x="18" y="98" class="t">nombre VARCHAR(120)</text><text x="18" y="126" class="t">descripcion TEXT</text><text x="18" y="154" class="t">activa BOOLEAN</text></g>
  <path d="M360 240H600" class="rel"/><path d="M780 365V510" class="rel"/><path d="M1290 335V430H460V650H420" class="rel"/><path d="M1140 650H945" class="rel"/><path d="M1290 335V470H1020V650H945" class="rel"/>
  <text x="430" y="210" class="s">perfil 1:N usuario</text><text x="1000" y="210" class="s">usuario N:1 perfil</text><text x="795" y="450" class="s">medicamento 1:N cronograma</text><text x="980" y="640" class="s">tarea 1:N acceso</text><text x="520" y="435" class="s">medicamento 1:N acceso</text>
</svg>
