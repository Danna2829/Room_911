<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950">
  <style>
    .bg{fill:#f5f7fb}.cls{fill:#fff;stroke:#2368c4;stroke-width:2}.head{fill:#eaf2ff;stroke:#2368c4;stroke-width:2}.t{font:14px Arial;fill:#17212b}.h{font:bold 24px Arial;fill:#17212b}.name{font:bold 17px Arial;fill:#17212b}.rel{stroke:#53687c;stroke-width:2;fill:none}.s{font:13px Arial;fill:#5d6b7a}
  </style>
  <rect width="1500" height="950" class="bg"/><text x="45" y="50" class="h">Room_911 · Diagrama de clases del dominio</text><text x="45" y="77" class="s">Entidades JPA y relaciones que corresponden al modelo PostgreSQL</text>
  <g transform="translate(60,135)"><rect width="360" height="270" class="cls"/><rect width="360" height="45" class="head"/><text x="180" y="29" text-anchor="middle" class="name">Usuario</text><text x="18" y="75" class="t">+ idUsuario: String</text><text x="18" y="99" class="t">+ nombre: String</text><text x="18" y="123" class="t">+ apellido: String</text><text x="18" y="147" class="t">+ rol: String</text><text x="18" y="171" class="t">+ activo: boolean</text><text x="18" y="195" class="t">+ suspendidoDesde: LocalDate</text><text x="18" y="219" class="t">+ suspendidoHasta: LocalDate</text><line x1="0" y1="235" x2="360" y2="235" class="rel"/><text x="18" y="258" class="t">+ estaSuspendido(fecha): boolean</text></g>
  <g transform="translate(1080,135)"><rect width="360" height="225" class="cls"/><rect width="360" height="45" class="head"/><text x="180" y="29" text-anchor="middle" class="name">Perfil</text><text x="18" y="75" class="t">+ id: Long</text><text x="18" y="99" class="t">+ nombre: String</text><text x="18" y="123" class="t">+ nivel: Integer</text><text x="18" y="147" class="t">+ tiposPermitidos: String</text><line x1="0" y1="165" x2="360" y2="165" class="rel"/><text x="18" y="190" class="t">+ permiteTipo(tipo): boolean</text></g>
  <g transform="translate(540,135)"><rect width="360" height="200" class="cls"/><rect width="360" height="45" class="head"/><text x="180" y="29" text-anchor="middle" class="name">Medicamento</text><text x="18" y="80" class="t">+ id: String</text><text x="18" y="106" class="t">+ nombre: String</text><text x="18" y="132" class="t">+ tipo: Integer</text></g>
  <g transform="translate(60,570)"><rect width="360" height="230" class="cls"/><rect width="360" height="45" class="head"/><text x="180" y="29" text-anchor="middle" class="name">Cronograma</text><text x="18" y="78" class="t">+ id: Long</text><text x="18" y="104" class="t">+ diaSemana: String</text><text x="18" y="130" class="t">+ horaInicio: LocalTime</text><text x="18" y="156" class="t">+ horaFin: LocalTime</text><text x="18" y="182" class="t">+ actividad: String</text></g>
  <g transform="translate(540,570)"><rect width="360" height="260" class="cls"/><rect width="360" height="45" class="head"/><text x="180" y="29" text-anchor="middle" class="name">RegistroAcceso</text><text x="18" y="78" class="t">+ id: Long</text><text x="18" y="104" class="t">+ fechaHora: LocalDateTime</text><text x="18" y="130" class="t">+ accion: String</text><text x="18" y="156" class="t">+ resultado: String</text><text x="18" y="182" class="t">+ motivo: String</text><text x="18" y="208" class="t">+ tareaAlternativa: String</text></g>
  <g transform="translate(1080,570)"><rect width="360" height="205" class="cls"/><rect width="360" height="45" class="head"/><text x="180" y="29" text-anchor="middle" class="name">TareaAlternativa</text><text x="18" y="78" class="t">+ id: Long</text><text x="18" y="104" class="t">+ nombre: String</text><text x="18" y="130" class="t">+ descripcion: String</text><text x="18" y="156" class="t">+ activa: boolean</text></g>
  <path d="M420 180H480V100H1020V180H1080" class="rel"/><text x="700" y="92" class="s">perfil 1 —— * usuario</text>
  <path d="M240 570V480H720V335" class="rel"/><text x="485" y="468" class="s">medicamento 1 —— * cronograma</text>
  <path d="M240 405V570" class="rel"/><text x="255" y="500" class="s">usuario 0..1 —— * acceso</text>
  <path d="M900 680H1080" class="rel"/><text x="930" y="670" class="s">acceso * —— 0..1 tarea</text>
  <text x="45" y="885" class="s">Nota: RegistroAcceso puede conservar el texto de la tarea como snapshot y además referenciar tarea_alternativa.</text>
</svg>
