spring.application.name=Room911
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Sala_911}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:fabrica2024*}

# DDL y Scripts de Inicialización
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Logs de SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (en produccion sobreescribir JWT_SECRET via variable de entorno)
jwt.secret=${JWT_SECRET:room911-dev-secret-cambiar-en-produccion-0123456789abcdef}
jwt.expiration-ms=28800000
